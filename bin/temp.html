<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Example</title>
  <style>
    #box {
      width: 100px;
      height: 100px;
      background-color: red;
      position: absolute;
      top: 50px;
      left: 50px;
    }
  </style>
</head>
<body>

  <div id="box"></div>

  <!-- GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script>
    // Animate the box: move right 300px, rotate 360 degrees, scale up
    gsap.to("#box", { 
      x: 300,           // move right
      rotation: 360,    // rotate
      scale: 1.5,       // grow bigger
      duration: 2,      // 2 seconds
      ease: "power2.inOut" // smooth easing
    });
  </script>

</body>
</html>
